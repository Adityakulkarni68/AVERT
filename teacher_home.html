<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Home</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .status-present {
      color: #4CAF50;
      font-weight: 500;
    }
    .status-late {
      color: #FF9800;
      font-weight: 500;
    }
    .status-absent {
      color: #F44336;
      font-weight: 500;
    }
    .message.success {
      background-color: #4CAF50;
      color: white;
    }
    .message.error {
      background-color: #F44336;
      color: white;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .date-selector {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-selector label {
      font-weight: 500;
    }
    .date-selector input {
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
    }
    .attendance-history {
      margin-top: 30px;
    }
    .attendance-history h2 {
      margin-bottom: 15px;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
    }
    .history-table th,
    .history-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    .history-table th {
      background-color: var(--table-header-bg);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="teacher_home.html">Teacher Dashboard</a>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span class="theme-icon">🌙</span>
      <span class="theme-text">Dark Mode</span>
    </button>
  </div>

  <div class="container">
    <h1>Teacher Dashboard</h1>
    
    <div class="attendance-actions">
      <h2>Mark Attendance</h2>
      <div class="date-selector">
        <label for="attendanceDate">Select Date:</label>
        <input type="date" id="attendanceDate">
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by name or roll no...">
      </div>
      <table id="studentsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Branch</th>
            <th>Section</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="message" class="message" style="display: none;"></div>
    </div>

    <div class="attendance-history">
      <h2>Attendance History</h2>
      <table class="history-table" id="historyTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Present</th>
            <th>Late</th>
            <th>Absent</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./teacher_home.js"></script>
  <script>
    // Set default date to today
    document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
    
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('.theme-icon');
    const themeText = themeToggle.querySelector('.theme-text');
    
    // Check for saved theme preference
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    });
    
    function updateThemeButton(theme) {
      themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
      themeText.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
    }
  </script>
</body>
</html>
