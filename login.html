<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nav">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="teacher_home.html">Teacher Dashboard</a>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span class="theme-icon">🌙</span>
      <span class="theme-text">Dark Mode</span>
    </button>
  </div>

  <div class="container" style="max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Login</h2>
    <div class="role-selector" style="margin-bottom: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
      <button id="teacherBtn" class="btn active" style="flex: 1;">Teacher</button>
      <button id="adminBtn" class="btn" style="flex: 1;">Admin</button>
    </div>
    <form id="loginForm" style="display: flex; flex-direction: column; gap: 1rem;">
      <input type="email" id="email" placeholder="Email" required 
        style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-secondary);" />
      <input type="password" id="password" placeholder="Password" required 
        style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-secondary);" />
      <button type="submit" class="btn" style="width: 100%;">Login</button>
    </form>
    <div id="loginError" class="message error" style="display: none;"></div>
  </div>

  <script type="module" src="./login.js"></script>
  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('.theme-icon');
    const themeText = themeToggle.querySelector('.theme-text');
    
    // Check for saved theme preference
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    });
    
    function updateThemeButton(theme) {
      themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
      themeText.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
    }

    // Role selection functionality
    const teacherBtn = document.getElementById('teacherBtn');
    const adminBtn = document.getElementById('adminBtn');
    let currentRole = 'teacher';

    teacherBtn.addEventListener('click', () => {
      teacherBtn.classList.add('active');
      adminBtn.classList.remove('active');
      currentRole = 'teacher';
    });

    adminBtn.addEventListener('click', () => {
      adminBtn.classList.add('active');
      teacherBtn.classList.remove('active');
      currentRole = 'admin';
    });
  </script>
</body>
</html>
