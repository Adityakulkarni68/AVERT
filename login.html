<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nav">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span class="theme-icon">🌙</span>
      <span class="theme-text">Dark Mode</span>
    </button>
  </div>

  <div class="login-page">
    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <h2>Welcome Back</h2>
          <p>Please login to continue</p>
        </div>
        
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-group">
              <span class="input-icon">📧</span>
              <input type="email" id="email" placeholder="Enter your email" required class="form-control" />
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" placeholder="Enter your password" required class="form-control" />
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary login-btn">
            <span class="btn-text">Login</span>
            <span class="btn-icon">→</span>
          </button>
        </form>
        
        <div class="login-footer">
          <p>Need help? <a href="#" class="help-link">Contact Support</a></p>
        </div>
      </div>
    </div>
    
    <div class="login-decoration">
      <div class="decoration-circle circle-1"></div>
      <div class="decoration-circle circle-2"></div>
      <div class="decoration-circle circle-3"></div>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('.theme-icon');
    const themeText = themeToggle.querySelector('.theme-text');
    
    // Check for saved theme preference
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    });
    
    function updateThemeButton(theme) {
      themeIcon.textContent = theme === 'light' ? '🌙' : '☀️';
      themeText.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
    }
  </script>
</body>
</html>
