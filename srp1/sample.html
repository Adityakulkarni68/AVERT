<!DOCTYPE html>
<html>
<head>
  <title>Attendance System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form, .dashboard { margin-bottom: 30px; }
    select, button { margin: 5px; padding: 5px; }
    h1, h2 { color: #2c3e50; }
    ul { list-style: none; padding: 0; }
    li { background: #f8d7da; margin: 5px 0; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Mark Attendance</h1>
  <form id="attendanceForm">
    <select id="studentSelect">
      <option value="1">John Doe</option>
      <option value="2">Jane Smith</option>
      <!-- These will be dynamically loaded from Firestore in the real app -->
    </select>
    <select id="statusSelect">
      <option value="present">Present</option>
      <option value="absent">Absent</option>
      <option value="late">Late</option>
    </select>
    <button type="submit">Mark</button>
  </form>

  <div class="dashboard">
    <h2>Students with &gt;5 Late Entries</h2>
    <ul id="violatorsList">
      <li>John Doe (6 times)</li>
      <!-- This will be dynamically loaded from Firestore in the real app -->
    </ul>
  </div>
</body>
</html>
